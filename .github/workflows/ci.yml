name: Infra Compose Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout bite-api
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/bite-api
          path: bite-api

      - name: Checkout harvester-go
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/harvester-go
          path: harvester-go

      - name: Checkout recsys-serving
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/recsys-serving
          path: recsys-serving

      - name: Checkout recommender
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/recommender
          path: recommender

      - name: Validate default compose
        working-directory: infra
        run: docker-compose config --services

      - name: Validate batch profile compose
        working-directory: infra
        run: docker-compose --profile batch config --services

      - name: Verify expected services
        working-directory: infra
        run: bash ./verify.sh
