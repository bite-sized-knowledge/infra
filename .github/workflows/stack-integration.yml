name: Infra Stack Integration

on:
  push:
    branches: ["main"]
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'verify.sh'
      - 'mysql/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout bite-api
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/bite-api
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: bite-api

      - name: Checkout harvester-go
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/harvester-go
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: harvester-go

      - name: Checkout recsys-serving
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/recsys-serving
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: recsys-serving

      - name: Checkout recommender
        uses: actions/checkout@v4
        with:
          repository: bite-sized-knowledge/recommender
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: recommender

      - name: Prepare integration env
        working-directory: infra
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          env_path = Path('.env')
          lines = env_path.read_text().splitlines()
          overrides = {
              'PROXY_URL': '',
              'DISCORD_WEBHOOK_URL': '',
              'OPENAI_API_KEY': '',
              'RESEND_API_KEY': '',
              'APP_BASE_URL': 'http://localhost:8080',
          }
          updated = []
          seen = set()
          for line in lines:
              if '=' not in line or line.startswith('#'):
                  updated.append(line)
                  continue
              key, _, _ = line.partition('=')
              if key in overrides:
                  updated.append(f'{key}={overrides[key]}')
                  seen.add(key)
              else:
                  updated.append(line)
          for key, value in overrides.items():
              if key not in seen:
                  updated.append(f'{key}={value}')
          env_path.write_text('\n'.join(updated) + '\n')
          PY

      - name: Start Docker stack
        working-directory: infra
        run: docker compose up -d mysql qdrant recsys-api bite-api harvester-go

      - name: Wait for stack health
        working-directory: infra
        run: |
          for i in $(seq 1 30); do
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            RECSYS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || true)
            if [ "$API_STATUS" = "200" ] && [ "$RECSYS_STATUS" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "stack failed to become healthy"
          docker compose logs --no-color
          exit 1

      - name: Verify compose service layout
        working-directory: infra
        run: bash ./verify.sh

      - name: Verify bite-api to recsys-api communication
        working-directory: infra
        run: |
          RESPONSE=$(docker compose exec -T bite-api wget -qO- "http://recsys-api:8001/feeds?member_id=1")
          echo "$RESPONSE"
          printf '%s' "$RESPONSE" | grep -q 'articles'

      - name: Verify harvester run and persistence
        working-directory: infra
        run: |
          sleep 30
          BEFORE=$(docker compose exec -T mysql sh -lc 'mysql -Nse "SELECT COUNT(*) FROM article_queue" -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' | tr -d '\r')
          echo "article_queue before restart: $BEFORE"
          docker compose restart harvester-go
          sleep 30
          LOGS=$(docker compose logs --no-color --tail=200 harvester-go)
          printf '%s\n' "$LOGS"
          printf '%s' "$LOGS" | grep -Eq 'harvester ticker started|rss loaded|default blog loaded|medium feed loaded|article harvested|existing article skipped'
          AFTER=$(docker compose exec -T mysql sh -lc 'mysql -Nse "SELECT COUNT(*) FROM article_queue" -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' | tr -d '\r')
          echo "article_queue after restart: $AFTER"
          [ -n "$BEFORE" ]
          [ -n "$AFTER" ]
          [ "$AFTER" -ge "$BEFORE" ]

      - name: Tear down stack
        if: always()
        working-directory: infra
        run: docker compose down -v
