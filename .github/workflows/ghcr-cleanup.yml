name: GHCR Image Cleanup

on:
  schedule:
    - cron: "0 20 * * *" # Daily 05:00 KST (UTC+9)
  workflow_dispatch:

env:
  ORG: bite-sized-knowledge
  KEEP_TAGS: "latest|dev"
  RETENTION_DAYS: 7

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        package:
          - bite-api
          - bite-web
          - harvester-go
          - recsys-serving
          - recommender
          - bite-monitor
          - bite-metric

    steps:
      # Multi-arch images (buildx) store the manifest list under the
      # user-facing tag (e.g. :latest) and each platform-specific child
      # manifest is itself untagged. Deleting untagged versions wipes
      # those children and leaves :latest pointing at a 404 manifest.
      # 2026-04-28 incident wiped 7 packages this way. Cleanup must only
      # touch versions that have a SHA tag and are past the retention
      # window — never untagged versions.
      - name: Delete old tagged versions
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = '${{ matrix.package }}';
            const org = '${{ env.ORG }}';
            const keepTags = /^(${{ env.KEEP_TAGS }})$/;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - ${{ env.RETENTION_DAYS }});

            let page = 1;
            let deleted = 0;

            while (true) {
              const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                package_type: 'container',
                package_name: pkg,
                org: org,
                per_page: 100,
                page: page,
              });

              if (versions.data.length === 0) break;

              for (const v of versions.data) {
                const tags = v.metadata?.container?.tags || [];
                const createdAt = new Date(v.created_at);

                // Never touch untagged versions: they are platform-specific
                // child manifests of multi-arch images. Deleting them
                // breaks the parent manifest list (and thus :latest).
                if (tags.length === 0) continue;
                // Skip if has a keep tag or is newer than cutoff
                if (tags.some(t => keepTags.test(t))) continue;
                if (createdAt > cutoff) continue;

                try {
                  await github.rest.packages.deletePackageVersionForOrg({
                    package_type: 'container',
                    package_name: pkg,
                    org: org,
                    package_version_id: v.id,
                  });
                  deleted++;
                  core.info(`Deleted ${pkg} v${v.id} (tags: ${tags.join(',') || 'none'}, created: ${v.created_at})`);
                } catch (e) {
                  core.warning(`Failed to delete ${pkg} v${v.id}: ${e.message}`);
                }
              }

              page++;
            }

            core.info(`${pkg}: deleted ${deleted} old versions`);
