services:
  mysql:
    image: mysql:8.0
    container_name: bite-mysql
    ports:
      - "0.0.0.0:3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - bite-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bite-qdrant
    ports:
      - "0.0.0.0:6333:6333"
      - "0.0.0.0:6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - bite-network

  qdrant-dev:
    image: qdrant/qdrant:latest
    container_name: bite-qdrant-dev
    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_dev_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - bite-network

  redis:
    image: redis:7-alpine
    container_name: bite-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bite-network

  recsys-api:
    image: ghcr.io/bite-sized-knowledge/recsys-serving:latest
    build: ../recsys-serving
    container_name: bite-recsys
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - qdrant
      - mysql
      - redis
    env_file:
      - .env
    volumes:
      - ./mysql/ca.pem:/etc/ssl/mysql-ca.pem:ro
      - ../recsys-serving/models:/app/models:ro
    environment:
      - RECSYS_API_KEY=${RECSYS_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - bite-network

  bite-api:
    image: ghcr.io/bite-sized-knowledge/bite-api:latest
    build: ../bite-api
    container_name: bite-api
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./mysql/ca.pem:/etc/ssl/mysql-ca.pem:ro
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RECSYS_API_KEY=${RECSYS_API_KEY}
      - RECSYS_SEARCH_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - bite-network

  harvester-go:
    image: ghcr.io/bite-sized-knowledge/harvester-go:latest
    build: ../harvester-go
    container_name: bite-harvester
    env_file:
      - .env
    volumes:
      - ./mysql/ca.pem:/etc/ssl/mysql-ca.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bite-network

  recommender:
    image: ghcr.io/bite-sized-knowledge/recommender:latest
    build: ../recommender
    container_name: bite-recommender
    profiles: ["batch"]
    env_file:
      - .env
    environment:
      RDS_DATABASE: ${RDS_DATABASE:-bite}
      RDS_HOST: ${RDS_HOST:-mysql}
      RDS_USER: ${RDS_USER:-bite-dev}
      RDS_PASSWORD: ${RDS_PASSWORD:-}
      RDS_PORT: ${RDS_PORT:-3306}
      QDRANT_ENDPOINT: ${QDRANT_ENDPOINT:-http://qdrant:6333}
      QDRANT_API: ${QDRANT_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - bite-network

  # === 운영계 웹 ===
  bite-web:
    image: ghcr.io/bite-sized-knowledge/bite-web:latest
    build: ../bite-web
    container_name: bite-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.bite-sized.xyz
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - bite-network
    depends_on:
      - bite-api
    restart: unless-stopped

  # === 개발계 API ===
  bite-api-dev:
    image: ghcr.io/bite-sized-knowledge/bite-api:dev
    build: ../bite-api
    container_name: bite-api-dev
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=bite_dev
      - DB_USER=bite-dev-user
      - DB_PASSWORD=${DEV_DB_PASSWORD}
      - JWT_SECRET_KEY=${DEV_JWT_SECRET_KEY}
      - APP_BASE_URL=https://dev-api.bite-sized.xyz
      - APP_ENV=development
      - GITHUB_CLIENT_ID=${DEV_GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${DEV_GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${DEV_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${DEV_GOOGLE_CLIENT_SECRET}
      - RECSYS_BASE_URL=http://recsys-api:8001
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - QDRANT_URL=http://qdrant-dev:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    networks:
      - bite-network
    restart: unless-stopped

  # === 개발계 웹 ===
  bite-web-dev:
    image: ghcr.io/bite-sized-knowledge/bite-web:dev
    build: ../bite-web
    container_name: bite-web-dev
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://dev-api.bite-sized.xyz
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${DEV_GITHUB_CLIENT_ID}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${DEV_GOOGLE_CLIENT_ID}
    networks:
      - bite-network
    depends_on:
      - bite-api-dev
    restart: unless-stopped

  deploy-webhook:
    build: ./deploy-webhook
    container_name: bite-deploy-webhook
    environment:
      - DEPLOY_TOKEN=${DEPLOY_TOKEN}
      # path-mirror: 컨테이너 cwd를 호스트 실경로와 동일하게 둬야
      # `docker compose config`가 풀어낸 상대 mount 경로가 host docker
      # daemon에서도 valid하다. CLAUDE.md 함정 섹션 참고.
      - COMPOSE_PATH=/Users/bite-server/projects/infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/bite-server/projects/infra:/Users/bite-server/projects/infra:ro
      - /Users/bite-server/.docker/config.json:/root/.docker/config.json:ro
      # Dedicated SSH deploy key used by the wake-and-rebuild strategy
      # (harvest-post). Container SSHs into the Mac host as bite-server,
      # which then runs wakeonlan + SSHs into the GPU. Read-only mount.
      - /Users/bite-server/.ssh/deploy_ed25519:/root/.ssh/deploy_ed25519:ro
    networks:
      - bite-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bite-tunnel
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /Users/bite-server/.cloudflared/554f1794-c5fb-4759-ba4c-6c88ccee59bb.json:/etc/cloudflared/554f1794-c5fb-4759-ba4c-6c88ccee59bb.json:ro
    networks:
      - bite-network
    depends_on:
      - bite-api
      - bite-web
      - deploy-webhook
      - bite-metric
    restart: unless-stopped

  # === 모니터링 ===
  bite-monitor:
    image: ghcr.io/bite-sized-knowledge/bite-monitor:latest
    build: ../bite-monitor
    container_name: bite-monitor
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=bite
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - DEPLOY_TOKEN=${DEPLOY_TOKEN}
      - DEPLOY_WEBHOOK_URL=http://deploy-webhook:9000
      - GITHUB_TOKEN=${GITHUB_PAT}
      - GPU_HOST=124.59.179.22
      - GPU_PORT=3475
      - GPU_USER=siroo
      - GPU_MAC=70:85:c2:a8:ad:b2
      - WOL_LOG=/logs/wake-and-harvest.log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup:/backup:ro
      # Colima doesn't share /tmp with containers; wake-and-harvest.sh
      # writes to infra/logs/ which is within the shared $HOME path.
      - ./logs:/logs:ro
      - /Users/bite-server/.ssh/deploy_ed25519:/root/.ssh/deploy_ed25519:ro
      - ./mysql/ca.pem:/etc/ssl/mysql-ca.pem:ro
    networks:
      - bite-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # === ML 메트릭 대시보드 ===
  bite-metric:
    image: ghcr.io/bite-sized-knowledge/bite-metric:latest
    build: ../bite-metric
    container_name: bite-metric
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=bite
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./mysql/ca.pem:/etc/ssl/mysql-ca.pem:ro
    networks:
      - bite-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: mysql:8.0
    container_name: bite-backup
    env_file:
      - .env
    volumes:
      - ./backup:/backup
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: /bin/sh
    command: ["-c", "while true; do sleep 86400; /backup.sh; done"]
    restart: unless-stopped
    networks:
      - bite-network
    depends_on:
      - mysql

volumes:
  mysql_data:
  qdrant_data:
  qdrant_dev_data:
  redis_data:

networks:
  bite-network:
    driver: bridge
