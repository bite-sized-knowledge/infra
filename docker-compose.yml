services:
  mysql:
    image: mysql:8.0
    container_name: bite-mysql
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bite-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bite-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bite-network

  recsys-api:
    image: ghcr.io/bite-sized-knowledge/recsys-serving:latest
    build: ../recsys-serving
    container_name: bite-recsys
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
      - mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bite-network

  bite-api:
    image: ghcr.io/bite-sized-knowledge/bite-api:latest
    build: ../bite-api
    container_name: bite-api
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bite-network

  harvester-go:
    image: ghcr.io/bite-sized-knowledge/harvester-go:latest
    build: ../harvester-go
    container_name: bite-harvester
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bite-network

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: bite-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    profiles: ["batch"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    networks:
      - bite-network

  recommender:
    image: ghcr.io/bite-sized-knowledge/recommender:latest
    build: ../recommender
    container_name: bite-recommender
    profiles: ["batch"]
    env_file:
      - .env
    environment:
      RDS_DATABASE: ${RDS_DATABASE:-bite}
      RDS_HOST: ${RDS_HOST:-mysql}
      RDS_USER: ${RDS_USER:-bite-dev}
      RDS_PASSWORD: ${RDS_PASSWORD:-}
      RDS_PORT: ${RDS_PORT:-3306}
      QDRANT_ENDPOINT: ${QDRANT_ENDPOINT:-http://qdrant:6333}
      QDRANT_API: ${QDRANT_API:-}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-ap-northeast-2}
      DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-http://dynamodb-local:8000}
      DYNAMODB_ACCESS_KEY_ID: ${DYNAMODB_ACCESS_KEY_ID:-dummy}
      DYNAMODB_SECRET_ACCESS_KEY: ${DYNAMODB_SECRET_ACCESS_KEY:-dummy}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      dynamodb-local:
        condition: service_started
    networks:
      - bite-network

  # === 운영계 웹 ===
  bite-web:
    image: ghcr.io/bite-sized-knowledge/bite-web:latest
    build: ../bite-web
    container_name: bite-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.bite-sized.xyz
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - bite-network
    depends_on:
      - bite-api
    restart: unless-stopped

  # === 개발계 API ===
  bite-api-dev:
    image: ghcr.io/bite-sized-knowledge/bite-api:dev
    build: ../bite-api
    container_name: bite-api-dev
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=bite_dev
      - DB_USER=bite-dev-user
      - DB_PASSWORD=${DEV_DB_PASSWORD}
      - JWT_SECRET_KEY=${DEV_JWT_SECRET_KEY}
      - APP_BASE_URL=https://dev-api.bite-sized.xyz
      - APP_ENV=development
      - GITHUB_CLIENT_ID=${DEV_GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${DEV_GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${DEV_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${DEV_GOOGLE_CLIENT_SECRET}
      - RECSYS_BASE_URL=http://recsys-api:8001
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    networks:
      - bite-network
    restart: unless-stopped

  # === 개발계 웹 ===
  bite-web-dev:
    image: ghcr.io/bite-sized-knowledge/bite-web:dev
    build: ../bite-web
    container_name: bite-web-dev
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://dev-api.bite-sized.xyz
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${DEV_GITHUB_CLIENT_ID}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${DEV_GOOGLE_CLIENT_ID}
    networks:
      - bite-network
    depends_on:
      - bite-api-dev
    restart: unless-stopped

  deploy-webhook:
    build: ./deploy-webhook
    container_name: bite-deploy-webhook
    environment:
      - DEPLOY_TOKEN=${DEPLOY_TOKEN}
      - COMPOSE_PATH=/infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/infra:ro
      - /Users/bite-server/.docker/config.json:/root/.docker/config.json:ro
    networks:
      - bite-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bite-tunnel
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /Users/bite-server/.cloudflared/554f1794-c5fb-4759-ba4c-6c88ccee59bb.json:/etc/cloudflared/554f1794-c5fb-4759-ba4c-6c88ccee59bb.json:ro
    networks:
      - bite-network
    depends_on:
      - bite-api
      - bite-web
      - deploy-webhook
    restart: unless-stopped

  backup:
    image: mysql:8.0
    container_name: bite-backup
    env_file:
      - .env
    volumes:
      - ./backup:/backup
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: /bin/sh
    command: ["-c", "while true; do sleep 86400; /backup.sh; done"]
    networks:
      - bite-network
    depends_on:
      - mysql

volumes:
  mysql_data:
  qdrant_data:
  dynamodb_data:

networks:
  bite-network:
    driver: bridge
